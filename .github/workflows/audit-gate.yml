name: Diamond Framework Audit Gate
on: [push, pull_request]
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: pip install -r verification/requirements.txt
      - name: Run Audit Gate & EIP Check
        run: |
          bash verification/audit-gate.sh
          python3 verification/eip_cost_check.py
