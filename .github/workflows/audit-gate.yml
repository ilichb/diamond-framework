name: Diamond Framework Audit Gate
on: [push, pull_request]
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      # G10 exige que el HEAD anclado exista y sea ancestro del actual
      # (git merge-base --is-ancestor); el checkout por defecto es shallow
      # (fetch-depth: 1) y deja el commit anclado fuera de la historia local.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: pip install -r verification/requirements.txt
      - name: Run Audit Gate & EIP Check
        run: |
          bash verification/audit-gate.sh
          python3 verification/eip_cost_check.py
