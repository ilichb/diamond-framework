# Foundry project for the Diamond Framework contracts.
#
# Scope: this project compiles `contracts/`, `test/` and `scripts/` ONLY.
# The EVM gas benchmarks live in their own independent Foundry project under
# `benchmarks/` (their results are cited by the paper and by C-20), and are
# deliberately NOT part of this project.
#
# forge-std is vendored once, inside the benchmarks project; this project
# reuses it through a remapping instead of vendoring a second copy.
#
# Anchor boundary: nothing under `integrations/` is part of the ten files
# sealed in `verification/anchor_root.sha256`, so building and testing here
# does not invalidate the anchor. See docs/architecture/implementation-plan.md.

[profile.default]
src = "contracts"
test = "test"
script = "scripts"
out = "out"
cache_path = "cache"
remappings = ["forge-std/=benchmarks/lib/forge-std/src/"]
# solc 0.8.33: it is the version the paper cites for the gas measurements
# (main.tex §9: "a local Foundry instance with Solc 0.8.33") and the only
# version installed on this machine (~/.local/share/svm/0.8.33). The README
# badge was aligned to 0.8.33 when gap B5 was closed; the one artefact still
# produced with 0.8.24 is benchmarks/results/gas_ingest_output.txt, whose
# provenance is documented in benchmarks/README.md.
solc = "0.8.33"
# Avalanche C-Chain is Cancun-equivalent (Etna); do not target Prague.
evm_version = "cancun"
# Same optimizer setting as the precompile benchmarks cited in the paper
# (Foundry default: optimizer = false), so gas numbers stay comparable.
optimizer = false

[fmt]
line_length = 100
tab_width = 4

[lint]
# `asm-keccak256` suggests replacing `keccak256(abi.encodePacked(...))` with a
# hand-written assembly loop. The inclusion-proof hashing is kept readable on
# purpose: the gas optimisation is a tracked item (implementation plan §7), not
# something to apply before there is a gas budget to hit.
exclude_lints = ["asm-keccak256"]
# The two Teleporter interface files transcribe an external ABI
# (`ava-labs/icm-contracts`) and keep *its* spelling, `sourceBlockchainID` and
# friends included, because the point of those files is to be diffable against
# upstream. forge-lint's `mixed-case-variable` note wants `sourceBlockchainId`;
# renaming would make every future comparison a manual one, so the note is
# switched off for exactly those two paths — and for them only.
ignore = [
    "contracts/interfaces/ITeleporterMessenger.sol",
    "contracts/interfaces/ITeleporterReceiver.sol",
]

